# Render Blueprint — lets Render configure the service automatically.
# Free plan. ADMIN_KEY is generated by Render; read it afterwards in
# Dashboard -> your service -> Environment.
services:
  - type: web
    name: pb-veto
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_KEY
        generateValue: true
